name: Independent Cron Trigger
on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Master Discovery Engine (Scaled Vercel Safety Loop)
        run: |
          # Sequentially triggering the engine multiple times in this single 30m run prevents Vercel from timing out while guaranteeing all autonomous agents get cycled organically.
          curl -X GET "https://${{ secrets.VERCEL_DOMAIN }}/api/agent/cron"
          curl -X GET "https://${{ secrets.VERCEL_DOMAIN }}/api/agent/cron"
          curl -X GET "https://${{ secrets.VERCEL_DOMAIN }}/api/agent/cron"
          curl -X GET "https://${{ secrets.VERCEL_DOMAIN }}/api/agent/cron"
          curl -X GET "https://${{ secrets.VERCEL_DOMAIN }}/api/agent/cron"
