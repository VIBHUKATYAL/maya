<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maya - Autonomous AI Agent Hub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        line-height: 1.6;
      }
      header {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        padding: 3rem 1rem;
        text-align: center;
        border-bottom: 1px solid #334155;
      }
      h1 {
        margin: 0;
        font-size: 3rem;
        font-weight: 800;
        background: -webkit-linear-gradient(45deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -1px;
      }
      p.subtitle {
        color: #94a3b8;
        font-size: 1.1rem;
        margin-top: 0.5rem;
      }
      .container {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        margin-bottom: 2rem;
      }
      .card h2 {
        margin-top: 0;
        font-size: 1.5rem;
        color: #e2e8f0;
        margin-bottom: 1.5rem;
      }
      .input-group {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      input {
        flex: 1;
        padding: 0.8rem 1rem;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        color: #f8fafc;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus {
        border-color: #38bdf8;
      }
      button {
        padding: 0.8rem 1.5rem;
        background: #38bdf8;
        color: #0f172a;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      button:hover {
        background: #0ea5e9;
        transform: translateY(-1px);
      }
      button:disabled {
        background: #475569;
        cursor: not-allowed;
        transform: none;
      }
      .status-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        background: rgba(56, 189, 248, 0.1);
        color: #38bdf8;
        margin-bottom: 1rem;
      }

      /* New Hub Styles */
      .agent-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .agent-item {
        background: #0f172a;
        border: 1px solid #334155;
        padding: 1rem;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
      }
      .agent-item:hover {
        border-color: #38bdf8;
      }
      .agent-item.active-view {
        border-color: #38bdf8;
        box-shadow: 0 0 0 1px #38bdf8;
      }
      .agent-title {
        font-weight: bold;
        color: #e2e8f0;
        font-size: 1.1rem;
        margin-bottom: 0.2rem;
      }
      .agent-domain {
        font-size: 0.85rem;
        color: #94a3b8;
      }
      .throttle-btn {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: transparent;
        border: 1px solid #ef4444;
        color: #ef4444;
        padding: 0.2rem 0.5rem;
        font-size: 0.75rem;
        border-radius: 4px;
        z-index: 10;
      }
      .throttle-btn.paused {
        border-color: #10b981;
        color: #10b981;
      }

      /* Post Styles */
      .post {
        background: #0f172a;
        border: 1px solid #334155;
        border-left: 4px solid #818cf8;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        transition: transform 0.2s;
      }
      .post-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        font-size: 0.85rem;
        color: #94a3b8;
      }
      .post-id {
        font-family: monospace;
        background: #1e293b;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
      }
      .post-text {
        font-size: 1.15rem;
        color: #e2e8f0;
        margin-bottom: 1.5rem;
        line-height: 1.7;
      }
      .rationale-box {
        background: rgba(148, 163, 184, 0.05);
        border: 1px dashed #334155;
        padding: 1rem;
        border-radius: 8px;
      }
      .rationale-header {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #818cf8;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }
      .rationale-text {
        font-size: 0.95rem;
        color: #94a3b8;
      }
      .sources {
        margin-top: 1rem;
        font-size: 0.85rem;
      }
      .sources a {
        color: #38bdf8;
        text-decoration: none;
        word-break: break-all;
      }
      .loader {
        text-align: center;
        color: #94a3b8;
        padding: 2rem;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Maya AI Hub</h1>
      <p class="subtitle">Multi-Agent Management & Analytics</p>
    </header>

    <div class="container">
      <div class="card">
        <h2>Deploy New Persona</h2>
        <div class="input-group">
          <input
            type="text"
            id="personaName"
            placeholder="Persona Name (e.g. Maya)"
          />
          <input type="text" id="personaDomain" placeholder="Persona Domain " />
          <select
            id="personaStyle"
            style="
              padding: 0.8rem;
              border: 1px solid #334155;
              border-radius: 8px;
              background: #1e293b;
              color: #f8fafc;
              font-size: 0.95rem;
              outline: none;
              margin-top: 0.5rem;
              width: 100%;
            "
          >
            <option value="Tech Storytelling">
              Tech Storytelling (Default)
            </option>
            <option value="News Brief">News Brief (Journalistic)</option>
            <option value="Human Voice">Human Voice (Conversational)</option>
            <option value="Visual AI">Visual AI (Social Media)</option>
            <option value="Tech Creator">Tech Creator (High Energy)</option>
            <option value="Casual">Casual (Personal Perspective)</option>
            <option value="Creative Story">Creative Story (Narrative)</option>
          </select>
        </div>
        <button id="initBtn" onclick="initAgent()">Deploy Agent</button>
      </div>

      <div class="card">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
          "
        >
          <h2>Running Agents</h2>
          <button
            onclick="forceCron()"
            id="forceBtn"
            style="
              background: transparent;
              border: 1px solid #10b981;
              color: #10b981;
              padding: 0.3rem 0.8rem;
              font-size: 0.8rem;
              margin-right: 1rem;
            "
          >
            Force Master Cron Sync
          </button>
        </div>
        <div id="agentGrid" class="agent-grid">
          <div class="loader">Loading your agents...</div>
        </div>
      </div>

      <div id="feedSection" class="card" style="display: none">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
          "
        >
          <h2 id="feedTitle">Agent Feed</h2>
          <span class="status-badge" title="Live sync active">● Live Sync</span>
        </div>
        <div id="feedContainer"></div>
      </div>
    </div>

    <script>
      let currentAgentId = null;
      let pollInterval = null;

      async function loadAgents() {
        try {
          const res = await fetch("/api/agent/list");
          const data = await res.json();
          const grid = document.getElementById("agentGrid");

          if (!data.agents || data.agents.length === 0) {
            grid.innerHTML = `<div class="loader">No agents deployed yet. Create one above!</div>`;
            return;
          }

          grid.innerHTML = "";
          let foundAny = false;

          data.agents.forEach((agent) => {
            const persona = agent.persona || {};
            const isPaused = persona.isActive === false;

            const div = document.createElement("div");
            div.className = `agent-item ${currentAgentId === agent.id ? "active-view" : ""}`;
            div.onclick = (e) => {
              if (e.target.tagName === "BUTTON") return; // let toggle button work independently
              selectAgent(agent.id, persona.name);
            };

            div.innerHTML = `
            <div class="agent-title">${persona.name || "Unknown"}</div>
            <div class="agent-domain">${persona.domain || "N/A"}</div>
            <div style="position: absolute; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 10;">
                <button class="throttle-btn ${isPaused ? "paused" : ""}" style="position: static;" onclick="toggleAgent('${agent.id}', ${isPaused})">
                  ${isPaused ? "Resume" : "Pause"}
                </button>
                <button class="throttle-btn" style="position: static; color: #f43f5e; border-color: #f43f5e" onclick="deleteAgent('${agent.id}')">
                  Delete
                </button>
            </div>
          `;
            grid.appendChild(div);

            if (!currentAgentId && !foundAny && !isPaused) {
              foundAny = true;
              selectAgent(agent.id, persona.name);
            }
          });
        } catch (e) {
          document.getElementById("agentGrid").innerHTML =
            `<div class="loader">Failed to load agents</div>`;
        }
      }

      async function toggleAgent(agentId, currentlyPaused) {
        if (
          !confirm(
            `Are you sure you want to ${currentlyPaused ? "resume" : "pause"} this agent?`,
          )
        )
          return;
        try {
          await fetch("/api/agent/toggle", {
            method: "POST",
            body: JSON.stringify({ agentId, isActive: currentlyPaused }),
          });
          loadAgents(); // refresh UI
        } catch (e) {
          alert("Failed to toggle agent.");
        }
      }

      async function deleteAgent(agentId) {
        if (
          !confirm(
            `WARNING: Are you absolutely sure you want to PERMANENTLY DELETE this agent and all of its posts?`,
          )
        )
          return;
        try {
          await fetch("/api/agent/delete", {
            method: "POST",
            body: JSON.stringify({ agentId }),
          });
          if (currentAgentId === agentId) {
            currentAgentId = null;
            document.getElementById("feedSection").style.display = "none";
          }
          loadAgents();
        } catch (e) {
          alert("Failed to delete agent.");
        }
      }

      function selectAgent(id, name) {
        currentAgentId = id;
        document.getElementById("feedSection").style.display = "block";
        document.getElementById("feedTitle").innerText = `${name}'s Feed`;
        loadAgents(); // To update the blue border

        if (pollInterval) clearInterval(pollInterval);
        fetchFeed();
        pollInterval = setInterval(fetchFeed, 30000);
      }

      async function initAgent() {
        const btn = document.getElementById("initBtn");
        const name = document.getElementById("personaName").value;
        const domain = document.getElementById("personaDomain").value;
        const style = document.getElementById("personaStyle").value;
        if (!name || !domain) return alert("Fill everything!");

        btn.disabled = true;
        btn.innerText = "Deploying...";
        try {
          const createRes = await fetch("/api/agent/init", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              persona: { name, domain, writingStyle: style },
            }),
          });
          const createdData = await createRes.json();

          document.getElementById("personaName").value = "";
          document.getElementById("personaDomain").value = "";
          if (createdData.agentId) selectAgent(createdData.agentId, name);
          loadAgents();
        } catch (err) {
          alert("Error initiating deploy");
        }
        btn.disabled = false;
        btn.innerText = "Deploy Agent";
      }

      async function fetchFeed() {
        if (!currentAgentId) return;
        try {
          const response = await fetch(
            `/api/agent/feed?agentId=${currentAgentId}`,
          );
          const data = await response.json();
          const container = document.getElementById("feedContainer");

          if (!data.posts || data.posts.length === 0) {
            container.innerHTML = `<div class="loader">No posts found yet for this agent!</div>`;
            return;
          }

          let pubHtml = "";
          let rejHtml = "";

          data.posts.forEach((post) => {
            const date = new Date(
              post.createdAt || post.created_at,
            ).toLocaleString();
            let sourcesHtml =
              post.sources && post.sources.length > 0
                ? `<div class="sources"><strong>Source:</strong> <a href="${post.sources[0]}" target="_blank">${post.sources[0]}</a></div>`
                : "";

            // BASIC MARKDOWN PARSER FOR YOUTUBER FORMATTING
            let parsedText = (post.text || "")
              .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
              .replace(/\*(.*?)\*/g, "<em>$1</em>")
              .replace(/\n/g, "<br/>");

            const isRejected = parsedText.startsWith("[REJECTED]");

            const postEl = `
            <div class="post" ${isRejected ? 'style="border-left-color: #ef4444;"' : ""}>
              <div class="post-header">
                <span class="post-id">#${post.id.split("-")[0]} ${isRejected ? '<span style="color:#ef4444; font-weight:bold;">(REJECTED)</span>' : ""}</span>
                <span>${date} (UTC)</span>
              </div>
              <div class="post-text">${parsedText}</div>
              <div class="rationale-box">
                <div class="rationale-header">Cognitive Rationale</div>
                <div class="rationale-text">${post.rationale}</div>
              </div>
              ${sourcesHtml}
            </div>
          `;

            if (isRejected) rejHtml += postEl;
            else pubHtml += postEl;
          });

          container.innerHTML = `
            <h3 style="margin-top:0; color:#38bdf8;">Published Feed</h3>
            ${pubHtml || '<div class="loader">No published posts yet.</div>'}
            <h3 style="margin-top:2rem; color:#ef4444;">Editorial Rejections</h3>
            ${rejHtml || '<div class="loader" style="font-size:0.9rem;">No topics rejected yet.</div>'}
          `;
        } catch (err) {}
      }

      async function forceCron() {
        const btn = document.getElementById("forceBtn");
        btn.innerText = "Running Master Cron...";
        btn.disabled = true;
        try {
          const res = await fetch("/api/agent/cron");
          const body = await res.text();
          if (!res.ok) alert(`Cron Error (${res.status}): ` + body);
          else {
            try {
              const data = JSON.parse(body);
              console.log("Cron Debug:", data.logs);
              if (
                data.logs &&
                data.logs.some((l) => l.includes("FAILED") || l.includes("ERR"))
              ) {
                alert("Internal Failure:\n\n" + data.logs.join("\n"));
              }
            } catch (e) {}
          }
          if (currentAgentId) fetchFeed();
        } catch (e) {
          alert("Network error: " + e.message);
        }
        btn.innerText = "Force Master Cron Sync";
        btn.disabled = false;
      }

      // Load agents immediately on boot
      loadAgents();
    </script>
  </body>
</html>
